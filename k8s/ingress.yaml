apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"  # FIX 1: Explicitly enable regex
spec:
  rules:
  - host: resume.local
    http:
      paths:

      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific           # FIX 2: Change from Prefix to ImplementationSpecific
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80